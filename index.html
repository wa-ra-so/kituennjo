<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>近くの喫煙所マップ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚬</text></svg>">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>🚬 近くの喫煙所マップ</h1>
    <button id="locate-btn" class="icon-btn" title="現在地に戻る">📍</button>
  </header>

  <div id="map"></div>

  <div class="controls">
    <label for="radius-select">表示範囲</label>
    <select id="radius-select">
      <option value="500">500m</option>
      <option value="1000" selected>1km</option>
      <option value="3000">3km</option>
      <option value="5000">5km</option>
      <option value="0">すべて</option>
    </select>
    <button id="add-spot-btn" class="primary-btn">＋ この地図の中心に喫煙所を追加</button>
  </div>

  <div id="status" class="status"></div>

  <section id="spot-list" class="spot-list"></section>

  <template id="spot-item-template">
    <div class="spot-item">
      <div class="spot-info">
        <div class="spot-name"></div>
        <div class="spot-address"></div>
      </div>
      <div class="spot-meta">
        <span class="spot-distance"></span>
        <a class="spot-directions" target="_blank" rel="noopener">ルート案内</a>
      </div>
    </div>
  </template>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
