<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>近くの喫煙所マップ</title>
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚬</text></svg>">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <div class="top-bar">
    <div class="title-panel">
      <div class="panel-head">
        <h1>近くの喫煙所</h1>
        <span id="ref-chip" class="ref-chip" hidden>
          <span id="ref-chip-label"></span>
          <button id="ref-chip-clear" type="button" aria-label="現在地に戻す">&times;</button>
        </span>
      </div>

      <div class="search-wrap">
        <div class="search-input">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.49 4.49 0 0 1 9.5 14z"/></svg>
          <input id="search-input" type="search" inputmode="search" autocomplete="off"
                 placeholder="駅名・地域名で検索（例: 船橋、渋谷区）"
                 aria-label="駅名・地域名で検索" role="combobox"
                 aria-expanded="false" aria-controls="search-results">
          <button id="search-clear" type="button" class="search-clear" aria-label="検索をクリア" hidden>&times;</button>
        </div>
        <ul id="search-results" class="search-results" role="listbox" hidden></ul>
      </div>

      <div class="segmented" id="radius-segmented" role="tablist">
        <button data-value="500">500m</button>
        <button data-value="1000" class="active">1km</button>
        <button data-value="3000">3km</button>
        <button data-value="5000">5km</button>
        <button data-value="0">すべて</button>
      </div>
    </div>
  </div>

  <div class="fab-stack">
    <button id="add-spot-btn" class="fab" title="この地図の中心に喫煙所を追加" aria-label="追加">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2z"/></svg>
    </button>
    <button id="osm-btn" class="fab" title="この範囲をOpenStreetMapから検索" aria-label="OSM検索">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.49 4.49 0 0 1 9.5 14z"/></svg>
    </button>
    <button id="yahoo-btn" class="fab fab-yahoo" title="この範囲をYahoo!ロコから検索（商業施設内の喫煙所向け）" aria-label="Yahoo!ロコ検索" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><text x="12" y="17" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">Y!</text></svg>
    </button>
    <button id="locate-btn" class="fab fab-primary" title="現在地に戻る" aria-label="現在地">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3A9.01 9.01 0 0 0 13 3.06V1h-2v2.06A9.01 9.01 0 0 0 3.06 11H1v2h2.06A9.01 9.01 0 0 0 11 20.94V23h2v-2.06A9.01 9.01 0 0 0 20.94 13H23v-2h-2.06zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></svg>
    </button>
  </div>

  <div class="sheet" id="sheet">
    <div class="sheet-handle-area" id="sheet-handle">
      <div class="sheet-handle"></div>
    </div>
    <div class="sheet-content">
      <div id="status" class="status"></div>
      <section id="spot-list" class="spot-list"></section>
    </div>
  </div>

  <template id="spot-item-template">
    <div class="spot-item">
      <div class="spot-icon">🚬</div>
      <div class="spot-info">
        <div class="spot-name"></div>
        <div class="spot-address"></div>
      </div>
      <div class="spot-meta">
        <span class="spot-distance"></span>
        <a class="spot-directions" target="_blank" rel="noopener">ルート案内</a>
      </div>
    </div>
  </template>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
